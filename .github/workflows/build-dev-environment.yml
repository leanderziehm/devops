name: Build dev-environment

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-dev-environment.yml"
      - "others/containers/dev-environment/**"

  workflow_dispatch:

permissions:
  contents: read
  packages: write
  
jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - file: Containerfile
            image: dev-environment
          - file: Containerfile.fedora
            image: dev-environment-fedora

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./others/containers/dev-environment/${{ matrix.file }}
          push: true
          tags: |
            ghcr.io/leanderziehm/${{ matrix.image }}:latest
            ghcr.io/leanderziehm/${{ matrix.image }}:${{ github.sha }}
