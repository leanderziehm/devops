
name: Build dev-environment

on:
  push:
    branches:
      - main
    paths:
      - others/containers/dev-environment/Containerfile.fedora
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./others/containers/dev-environment/Containerfile.fedora
          push: true
          tags: |
            ghcr.io/leanderziehm/dev-environment-fedora:latest
            ghcr.io/leanderziehm/dev-environment-fedora:${{ github.sha }}
          cache-from: type=gha,scope=dev-environment-fedora
          cache-to: type=gha,scope=dev-environment-fedora,mode=max
