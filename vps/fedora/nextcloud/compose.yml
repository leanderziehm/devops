services:
  db:
    image: docker.io/library/postgres:16-alpine
    container_name: nextcloud-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_DB in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - ${POSTGRES_LOCATION}:/var/lib/postgresql/data:Z
    # healthcheck:
      # test: ["CMD-SHELL", "pg_isready -U nextcloud -d nextcloud"]
      # interval: 10s
      # timeout: 5s
      # retries: 5

  redis:
    image: docker.io/library/redis:7-alpine
    container_name: nextcloud-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - ${REDIS_LOCATION}:/data:Z
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  app:
    image: docker.io/library/nextcloud:apache
    container_name: nextcloud-app
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:?Set DB_PASSWORD in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set DB_PASSWORD in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set DB_PASSWORD in .env}
      REDIS_HOST: redis
      NEXTCLOUD_TRUSTED_DOMAINS: ${NEXTCLOUD_TRUSTED_DOMAINS}
    volumes:
      - ${NEXTCLOUD_LOCATION}:/var/www/html:Z