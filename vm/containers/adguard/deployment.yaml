apiVersion: v1
kind: Pod
metadata:
  name: vm-dns-gateway
spec:
  containers:
    - name: adguardhome
      image: docker.io/adguard/adguardhome:latest
      ports:
        - containerPort: 53
          hostPort: 8053
          protocol: UDP
        - containerPort: 53
          hostPort: 8053
          protocol: TCP
        - containerPort: 3000 # Initial setup web UI
          hostPort: 3000
          protocol: TCP
        - containerPort: 80   # Admin dashboard after setup
          hostPort: 8080
          protocol: TCP
      volumeMounts:
        - mountPath: /opt/adguardhome/work
          name: adguard-work
        - mountPath: /opt/adguardhome/conf
          name: adguard-conf
  volumes:
    - name: adguard-work
      persistentVolumeClaim:
        claimName: adguard-work-pvc
    - name: adguard-conf
      persistentVolumeClaim:
        claimName: adguard-conf-pvc
