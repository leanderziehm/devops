apiVersion: v1
kind: ConfigMap
metadata:
  name: adguard-config
data:
  AdGuardHome.yaml: |
    http:
      address: 0.0.0.0:80
    users:
      - name: admin
        password: $2y$05$REPLACE_WITH_YOUR_BCRYPT_HASH
    dns:
      bind_hosts:
        - 0.0.0.0
      port: 53
      upstream_dns:
        - https://quad9.net
        - https://cloudflare-dns.com
    querylog:
      enabled: true
      interval: 720h
    filters:
      - enabled: true
        url: https://github.io
        name: AdGuard DNS filter
        id: 1
      - enabled: true
        url: https://github.io
        name: Malicious URL Blocklist (URLHaus)
        id: 2
    schema_version: 29
---
apiVersion: v1
kind: Pod
metadata:
  name: vm-dns-gateway
spec:
  containers:
    - name: adguardhome
      image: docker.io/adguard/adguardhome:latest
      ports:
        - containerPort: 53
          hostPort: 5353
          protocol: UDP
        - containerPort: 53
          hostPort: 5353
          protocol: TCP
        - containerPort: 80
          hostPort: 8080
          protocol: TCP
      volumeMounts:
        - mountPath: /opt/adguardhome/work
          name: adguard-work
        - mountPath: /opt/adguardhome/conf
          name: adguard-conf
  volumes:
    - name: adguard-work
      persistentVolumeClaim:
        claimName: adguard-work-pvc
    - name: adguard-conf
      configMap:
        name: adguard-config
