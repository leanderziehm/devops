apiVersion: apps/v1
kind: Deployment
metadata:
  name: example-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: example-api
  template:
    metadata:
      labels:
        app: example-api
    spec:
      containers:
        - name: example-api
          image: ghcr.io/leanderziehm/container-example-api:latest
          ports:
            - name: http
              containerPort: 8321
              hostPort: 8321
              protocol: TCP
          resources:
            limits:
              memory: "128Mi"
              cpu: "500m"